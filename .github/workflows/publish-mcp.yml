name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Publish underlying PyPI package:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify release versions
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          MANIFEST_VERSION=$(jq -r '.version' server.json)
          REGISTRY_PACKAGE_VERSION=$(jq -r '.packages[0].version' server.json)
          test "$PACKAGE_VERSION" = "$MANIFEST_VERSION" || { echo "Package and registry versions differ"; exit 1; }
          test "$PACKAGE_VERSION" = "$REGISTRY_PACKAGE_VERSION" || { echo "Registry package version differs"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" || { echo "Tag and package versions differ"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release tag is not on main"; exit 1; }
          fi

      - name: Build package
        run: python -m build

      - name: Verify packaged Web UI static assets
        run: python scripts/check_package_assets.py --dist-dir dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # Publish MCP server:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
